<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Marcador deportivo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .marcador {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .equipo {
            background-color: white;
            border: 3px solid #cccccc;
            border-radius: 10px;
            padding: 25px;
            width: 180px;
        }

        .nombre {
            font-size: 20px;
            font-weight: bold;
        }

        .resultado {
            font-size: 50px;
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        #mensaje {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Marcador deportivo</h1>

    <div class="marcador">

        <div id="caja-local" class="equipo">
            <div class="nombre">Equipo local</div>
            <div id="resultado-local" class="resultado">0</div>
            <button id="boton-local">+1 Local</button>
        </div>

        <div id="caja-visitante" class="equipo">
            <div class="nombre">Equipo visitante</div>
            <div id="resultado-visitante" class="resultado">0</div>
            <button id="boton-visitante">+1 Visitante</button>
        </div>

    </div>

    <div id="mensaje">
        Los equipos van empate
    </div>

</body>

</html>
