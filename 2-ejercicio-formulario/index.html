<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Entradas de concierto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .concierto {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }

        input {
            width: 60px;
            padding: 8px;
            margin: 15px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        .total {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="concierto">

        <h1>🎵 Concierto </h1>

        <p class="precio">
            Precio de la entrada: 25 <span>€</span>
        </p>

        <label>
            Número de entradas:
            <input id="numero-entradas" type="number" min="1" placeholder="Ej: 1">
        </label>

        <br>

        <button id="calcular">
            Calcular
        </button>

        <div class="total">
            Total: <span id="precio-total">--</span> <span>€</span>
        </div>

    </div>


    <script>
    // Precio de la entrada
        const precioEntrada = 25;

        // Conectar elementos del DOM
        const cajaEntradas = document.getElementById("numero-entradas");
        const botonCalcular = document.getElementById("calcular");
        const precioTotal = document.getElementById("precio-total");

        //Le decimos al boton que cuando se haga click ejecute la funcion
        botonCalcular.addEventListener("click", function () {
            //Leemos cuantas entradas ha introducido el usuario y lo convertimos a numero entero
            const numeroEntradas = parseInt(cajaEntradas.value);
            if (isNaN(numeroEntradas) || numeroEntradas < 1) {
                alert("Por favor, introduce un número válido de entradas.");
                return;
            }
            //Hacemos la multiplicacion del numero de entradas por el precio de la entrada y lo mostramos en el span correspondiente
            const total = numeroEntradas * precioEntrada;
            //Mostramos el total en el span correspondiente
            precioTotal.textContent = total;
        });

    </script>

</body>

</html>
